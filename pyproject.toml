[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "eddy-ai"
version = "0.1.0"
description = "Eddy AI: a plug-and-play universal robot controller that wraps existing robot code."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
vision = ["opencv-python-headless>=4.5", "mediapipe>=0.10"]
voice = ["vosk>=0.3.45", "sounddevice>=0.4"]
dev = ["pytest>=7"]

[project.scripts]
eddy = "eddy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
