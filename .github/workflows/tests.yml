name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: pytest and self-test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,serial]'
      - name: Unit and end-to-end tests (simulator)
        run: python -m pytest -q
      - name: Self-test
        run: eddy selftest

  ros2:
    name: ROS 2 Jazzy in Docker (mock robot)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - name: Discovery, driving, faults and arm checks
        run: ./tests/ros2/run.sh
